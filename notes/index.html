<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>日文學習筆記</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darkmode@latest/dist/style.min.css"/>
  <style>
    .speak-btn { background: none; border: none; font-size: 1rem; cursor: pointer; padding: 0 4px; margin-left: 4px; vertical-align: middle; opacity: 0.55; line-height: 1; }
    .speak-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function speakJa(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }

    window.$docsify = {
      name: '← 回首頁',
      nameLink: '../',
      repo: 'https://github.com/didiowen/nihongo',
      loadSidebar: true,
      basePath: '../',
      homepage: 'hiragana.md',
      subMaxLevel: 2,
      search: {
        placeholder: '搜尋筆記…',
        noData: '找不到結果',
        depth: 3,
        hideOtherSidebarContent: false,
      },
      darkMode: {
        dark:  { background: '#1e1e2e', toggleBtnBg: '#444', textColor: '#cdd6f4' },
        light: { background: '#ffffff', toggleBtnBg: '#34495e', textColor: '#34495e' },
      },
      plugins: [
        function(hook) {
          hook.beforeEach(function(content) {
            const fm = content.match(/^---[\s\S]*?---\n/);
            let footer = '';
            if (fm) {
              const m = fm[0].match(/updated:\s*(\d{4}-\d{2}-\d{2})/);
              if (m) footer = `\n\n---\n<small>最後更新：${m[1]}</small>`;
            }
            return content.replace(/^---[\s\S]*?---\n/, '') + footer;
          });
        },
        function(hook) {
          hook.doneEach(function() {
            var hash = window.location.hash;
            var m = hash.match(/#\/([^?#]*)/);
            var page = (m ? m[1].split('/').pop() : '') || 'hiragana';

            function findCol(table, header) {
              var ths = table.querySelectorAll('th');
              for (var i = 0; i < ths.length; i++) {
                if (ths[i].textContent.trim() === header) return i;
              }
              return -1;
            }

            function addBtn(table, colIdx, extract) {
              table.querySelectorAll('tr').forEach(function(row) {
                var cells = row.querySelectorAll('td');
                if (cells.length <= colIdx) return;
                var cell = cells[colIdx];
                if (cell.querySelector('.speak-btn')) return;
                var raw = cell.textContent.trim();
                var text = extract ? extract(raw) : raw;
                if (!text || !/[぀-ヿ一-鿿]/.test(text)) return;
                var btn = document.createElement('button');
                btn.className = 'speak-btn';
                btn.title = '朗讀';
                btn.textContent = '🔊';
                btn.onclick = function() { speakJa(text); };
                cell.appendChild(btn);
              });
            }

            function eachTable(fn) {
              var sec = document.querySelector('.markdown-section');
              if (!sec) return;
              var h2 = '', h3 = '';
              Array.from(sec.children).forEach(function(el) {
                if (el.tagName === 'H2') { h2 = el.textContent.trim(); h3 = ''; }
                else if (el.tagName === 'H3') h3 = el.textContent.trim();
                else if (el.tagName === 'TABLE') fn(el, h2, h3);
              });
            }

            if (page === 'hiragana') {
              var tables = document.querySelectorAll('.markdown-section table');
              if (tables.length) addBtn(tables[0], 0);

            } else if (page === 'katakana') {
              eachTable(function(table, h2) {
                if (!h2.includes('發音規則補充')) addBtn(table, 0);
              });

            } else if (page === 'kanji') {
              eachTable(function(table, h2, h3) {
                var col;
                if (h2 === '讀音細分') {
                  col = findCol(table, '讀音');
                  if (col >= 0) addBtn(table, col);
                } else if (h3 === '連声（れんじょう）') {
                  col = findCol(table, '連声後');
                  if (col >= 0) addBtn(table, col);
                } else if (h2 === '日本人姓名讀法' && h3 === '本節名字解析') {
                  col = findCol(table, '讀音');
                  if (col >= 0) addBtn(table, col);
                } else if (h3 === '臺灣地名：台語舊名 ↔ 日治改名') {
                  col = findCol(table, '日語讀音');
                  if (col >= 0) addBtn(table, col, function(t) { return t.split(/[（\s]/)[0]; });
                }
              });
            }
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-darkmode@latest/dist/index.min.js"></script>

</body>
</html>
