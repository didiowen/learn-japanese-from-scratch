<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>日文學習筆記</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darkmode@latest/dist/style.min.css"/>
  <style>
    .speak-btn { background: none; border: none; font-size: 1rem; cursor: pointer; padding: 0 4px; margin-left: 4px; vertical-align: middle; opacity: 0.55; line-height: 1; }
    .speak-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function speakJa(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }

    window.$docsify = {
      name: '← 回首頁',
      nameLink: '../',
      repo: 'https://github.com/didiowen/nihongo',
      loadSidebar: true,
      basePath: '../',
      homepage: 'hiragana.md',
      subMaxLevel: 2,
      search: {
        placeholder: '搜尋筆記…',
        noData: '找不到結果',
        depth: 3,
        hideOtherSidebarContent: false,
      },
      darkMode: {
        dark:  { background: '#1e1e2e', toggleBtnBg: '#444', textColor: '#cdd6f4' },
        light: { background: '#ffffff', toggleBtnBg: '#34495e', textColor: '#34495e' },
      },
      plugins: [
        function(hook) {
          hook.beforeEach(function(content) {
            const fm = content.match(/^---[\s\S]*?---\n/);
            let footer = '';
            if (fm) {
              const m = fm[0].match(/updated:\s*(\d{4}-\d{2}-\d{2})/);
              if (m) footer = `\n\n---\n<small>最後更新：${m[1]}</small>`;
            }
            return content.replace(/^---[\s\S]*?---\n/, '') + footer;
          });
        },
        function(hook) {
          hook.doneEach(function() {
            document.querySelectorAll('.markdown-section table tr').forEach(function(row) {
              const cells = row.querySelectorAll('td');
              if (cells.length < 2) return;
              const cell = cells[1];
              if (cell.querySelector('.speak-btn')) return;
              const text = cell.textContent.trim();
              if (!/[぀-ヿ一-鿿]/.test(text)) return;
              const btn = document.createElement('button');
              btn.className = 'speak-btn';
              btn.title = '朗讀';
              btn.textContent = '🔊';
              btn.onclick = function() { speakJa(text); };
              cell.appendChild(btn);
            });
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-darkmode@latest/dist/index.min.js"></script>

</body>
</html>
